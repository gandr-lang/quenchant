#:tombi toml-version = "v1.1.0"
#:schema https://mise.jdx.dev/schema/mise-task.json

# The arithmetic library ships two profiles, so every Rust lane runs twice:
# once with strict arithmetic and once with `fast`. The feature is named
# package-qualified because the workspace root is virtual.
["check:build"]
description = "Build every workspace target in strict and fast modes"
run = [
  "cargo build --workspace --all-targets --locked",
  "cargo build --workspace --all-targets --locked --features quenchant-arith/fast",
  "cargo build --workspace --all-targets --locked --features quenchant/anodized,quenchant-arith/anodized,quenchant-shape/anodized,quenchant-spec-macros/anodized",
  "cargo build --locked -p quenchant --features gates",
]

# The Dylint library builds and lints from its own package directory, where the
# crate-local `dylint-link` setting in `.cargo/config.toml` applies; a root-cwd
# pass would link its cdylib with the wrong linker. Every other member is
# reached by the workspace pass, so the wall covers the tree exactly once.
["check:clippy"]
description = "Enforce the complete lint wall in both arithmetic modes"
depends = ["dylint:clippy"]
run = [
  "cargo clippy --workspace --all-targets --locked --exclude quenchant-dylints -- --deny warnings",
  "cargo clippy --workspace --all-targets --locked --exclude quenchant-dylints --features quenchant-arith/fast -- --deny warnings",
  "cargo clippy --workspace --all-targets --locked --exclude quenchant-dylints --features quenchant-arith/anodized,quenchant-shape/anodized,quenchant-spec-macros/anodized -- --deny warnings",
]

["dylint:clippy"]
description = "Lint the compiler plugin from its linker-configured directory"
dir = "crates/quenchant-dylints"
run = "cargo clippy --all-targets -- --deny warnings"

# Panic mode is chosen while the proc-macro dependency compiles, so each
# enforcing twin sets RUSTFLAGS for the whole graph rather than one crate alone.
# The Dylint library's UI matrix runs from its own package directory under the
# `ci` nextest profile, which is where its compiletest fixtures resolve.
["check:tests"]
description = "Exercise every specification with and without enforcement"
depends = ["tests:enforcing", "dylint:tests"]
run = [
  "cargo nextest run --workspace --exclude quenchant-dylints --locked",
  "cargo nextest run --workspace --exclude quenchant-dylints --locked --release",
  "cargo nextest run --workspace --exclude quenchant-dylints --locked --features quenchant-arith/fast",
  "cargo nextest run --workspace --exclude quenchant-dylints --locked --features quenchant-arith/fast --release",
  "cargo test --doc --locked -p quenchant -p quenchant-arith -p quenchant-shape -p quenchant-anodized -p quenchant-spec-macros -p quenchant-fixture-macros",
  "cargo test --doc --locked -p quenchant-arith --features quenchant-arith/fast",
]

["tests:enforcing"]
description = "Exercise library specifications under enforcing cfgs"
env.RUSTFLAGS = "--cfg anodized_panic"
run = [
  "cargo nextest run --workspace --exclude quenchant-dylints --locked --features quenchant-arith/anodized,quenchant-shape/anodized,quenchant-spec-macros/anodized",
  "cargo nextest run --workspace --exclude quenchant-dylints --locked --release --features quenchant-arith/anodized,quenchant-shape/anodized,quenchant-spec-macros/anodized",
  "cargo nextest run --workspace --exclude quenchant-dylints --locked --features quenchant-arith/fast,quenchant-arith/anodized,quenchant-shape/anodized,quenchant-spec-macros/anodized",
]

["dylint:tests"]
description = "Exercise the compiler plugin from its linker-configured directory"
dir = "crates/quenchant-dylints"
run = "cargo nextest run --profile ci"

["check:miri"]
description = "Interpret the valid-input fast precondition witnesses"
# Miri interprets unoptimized MIR; the test profile's optimization is ignored.
env.CARGO_PROFILE_TEST_OPT_LEVEL = "0"
run = "cargo miri test --locked -p quenchant-arith --features quenchant-arith/fast"

# A successful campaign must kill at least one viable mutant. A zero-byte
# caught inventory is a failed measurement, not a clean campaign.
# Only mutant builds cap lints: deleted bodies otherwise trip the unused wall
# before any test can witness the injected fault. The regular gate is unchanged.
["mutants:campaign"]
description = "Run a standalone mutation campaign with a nonempty kill inventory"
run = [
  "cargo mutants --cap-lints=true --cargo-arg=--locked --test-tool nextest --output target/mutants",
  "test -s target/mutants/mutants.out/caught.txt",
]
