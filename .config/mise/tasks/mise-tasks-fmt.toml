#:tombi toml-version = "v1.0.0"
#:schema https://mise.jdx.dev/schema/mise-task.json

[treefmt]
description = "Run treefmt"
run = "treefmt"

["treefmt:check"]
description = "Run treefmt in CI mode"
run = "treefmt --ci"

[changelog]
description = "Render committed release history after fetching full history and tags"
run = "git-cliff --config cliff.toml --output CHANGELOG.md"
