#:tombi toml-version = "v1.0.0"
#:schema https://mise.jdx.dev/schema/mise-task.json

# Marker recognition and its seven-character boundary live in the Rust gate.
["check:conflict-markers"]
description = "Detect unresolved Git conflict markers in tracked files"
run = ".config/mise/scope cargo run --quiet --locked -p quenchant-gates -- conflict-markers"

# The shared baseline page is byte-identical wherever it is tracked and pinned
# by content hash. The pin is `docs/agents/baseline.sha256` beside the page, one
# `sha256sum` check line, so no script and no binary carries a digest. macOS
# ships `sha256sum` as `/sbin/sha256sum`.
["check:baseline-hash"]
description = "Check the shared baseline page against the pin beside it"
run = "sha256sum -c docs/agents/baseline.sha256"

["check:public-boundary"]
description = "Reject private-material shapes in repository history and tree"
run = ".config/mise/scope cargo run --quiet --locked -p quenchant-gates -- public-boundary"

["check:ci-pins"]
description = "Check compiler-coupled and Dylint version pins"
run = ".config/mise/scope cargo run --quiet --locked -p quenchant-gates -- pins"

["check:action-pins"]
description = "Require allowed, full-SHA GitHub Action references"
run = ".config/mise/scope cargo run --quiet --locked -p quenchant-gates -- action-pins"

# A workflow never hashes the whole workspace through `hashFiles('**/…')`:
# the runner evaluates it on the host and walks every file, and a container
# job's restored `target/` makes the walk fail (#87). A step computes such a
# fingerprint in the shell over tracked files instead.
["check:workflow-hashing"]
description = "No workspace-wide hashFiles glob in a workflow or composite action"
run = """
if git grep -nIE -e "hashFiles[(][^)]*'[*][*]" -- ':/.github'; then
  echo 'workflow hashing check FAILED: hashFiles over the whole workspace; fingerprint tracked files in the shell' >&2
  exit 1
fi
echo 'workflow hashing check OK: no workspace-wide hashFiles glob'
"""

["check:publish"]
description = "Verify the exact package publication eligibility boundary"
run = ".config/mise/scope cargo run --quiet --locked -p quenchant-gates -- publish-allowlist"

# Cargo selects publishable members from their manifests, orders dependencies,
# and resolves unpublished siblings through its temporary packaging registry.
# Publication queries require registry access even in dry-run mode. Dirty trees
# are accepted so local checks verify edits before a commit. Rustup run pins
# host macros compiled outside the checkout during tarball verification.
# Local-registry packages have immutable name/version identities. A fresh
# registry path prevents cached source or artifacts from another revision of
# an unpublished sibling from satisfying tarball verification.
["check:publish-dry-run"]
description = "Verify every publishable package without uploading"
depends = ["check:publish"]
run = [
  "rm -rf -- target/publish",
  "mkdir -p target/publish",
  ".config/mise/scope rustup run {{ exec(command='mise exec -- rustup show active-toolchain') | split(pat=' ') | first | quote }} cargo publish --workspace --dry-run --locked --allow-dirty --target-dir \"$(mktemp -d target/publish/run.XXXXXXXXXX)\"",
]

["check:deny"]
description = "Check dependency advisories, versions, licenses, and sources"
run = [
  "cargo deny fetch db",
  "cargo deny --all-features --locked check --graph target/cargo-deny advisories bans licenses sources",
]

["check:anodized"]
description = "Report the resolved specification state of the workspace"
run = ".config/mise/scope cargo run -p quenchant-gates --locked -- anodized --manifest-path Cargo.toml"

# The enforcing twin: the specification runtime turns postcondition failures
# into panics across the whole dependency graph, so RUSTFLAGS is set for the
# entire build rather than for one crate.
["check:anodized-enforcing"]
description = "Require enforcing cfgs and exercise real postcondition failures"
env.RUSTFLAGS = "--cfg anodized_panic"
run = ".config/mise/scope cargo run --quiet --locked --bin quenchant-gates --features quenchant-anodized/anodized -- anodized --manifest-path Cargo.toml --require-enforcing"
depends = ["anodized:specifications"]

["anodized:specifications"]
description = "Exercise real postcondition failures with enforcing specifications"
dir = "crates/quenchant-dylints"
env.RUSTFLAGS = "--cfg anodized_panic"
run = "{{ config_root }}/.config/mise/scope rustup run {{ exec(command='mise exec -- rustup show active-toolchain') | split(pat=' ') | first | quote }} {{ exec(command='mise which cargo-nextest') | quote }} nextest run --profile ci --features quenchant-anodized/anodized -E 'test(specification_tests::)'"

["check:no-std"]
description = "Build both library modes for a bare-metal target without std"
run = [
  ".config/mise/scope cargo build --locked -p quenchant -p quenchant-arith -p quenchant-shape --no-default-features --target thumbv7em-none-eabi",
  ".config/mise/scope cargo build --locked -p quenchant-arith -p quenchant-shape --no-default-features --features quenchant-arith/fast --target thumbv7em-none-eabi",
]

["check:witnesses"]
description = "Resolve every declared adequacy witness against a runnable target"
run = ".config/mise/scope cargo run -p quenchant-gates --locked -- witnesses --manifest-path Cargo.toml"

# The compiler-plugin half of the lint wall, self-hosted: the library is a
# member of this workspace and is loaded from its path, so the driver builds it
# from these sources rather than from a pinned revision. Incremental
# compilation is off because the driver reads whole-crate HIR: an incremental
# rebuild can skip the units the lints need to see. A toolchain bump
# invalidates the driver -- `rm -rf ~/.dylint_drivers target/dylint` before the
# wall runs again. The six executable-specification, adequacy and clause-cost
# lints are denied here for every workspace target, rather than in individual
# crate roots, and so is the module-documentation shape (`rustdoc_shape`);
# `doc_history_prose` is a report, forced to `warn` so the workspace's denied
# warnings never make it a refusal.
# CI invokes this task to use the same policy and compiler environment.
["check:dylint"]
description = "Load the workspace's own Dylint library over the workspace"
env.CARGO_INCREMENTAL = "0"
env.DYLINT_RUSTFLAGS = "-D spec_attribute_present -D adequacy_present -D maybe_shape -D erased_error_signature -D spec_attribute_unqualified -D spec_clause_traversal -D rustdoc_shape --force-warn doc_history_prose"
# The plugin must link through dylint-link even when cargo dylint builds it
# from the workspace root, where its crate-local Cargo configuration is absent.
# Cargo's linker variable is per target, so each host the wall runs on is
# named: the Linux CI image on arm64 and x86-64, and the Apple Silicon and
# Intel developer hosts.
env.CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER = "dylint-link"
env.CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER = "dylint-link"
env.CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER = "dylint-link"
env.CARGO_TARGET_X86_64_APPLE_DARWIN_LINKER = "dylint-link"
# Cargo's encoded flags win even when empty. Otherwise encode the ordinary
# whitespace-separated flags before appending this policy-only cfg. Dylint's
# workspace wrapper alone does not configure external dependencies. The clause
# cost gate follows calls into other crates' bodies, which metadata carries for
# every function only under `-Zalways-encode-mir`; `-Zinline-mir=no` keeps
# standard-library calls as calls in every profile.
env.CARGO_ENCODED_RUSTFLAGS = "{% if env.CARGO_ENCODED_RUSTFLAGS is defined %}{% set flags = env.CARGO_ENCODED_RUSTFLAGS %}{% else %}{% set flags = env.RUSTFLAGS | default(value='') | trim | regex_replace(pattern='\\\\s+', rep='\u001f') %}{% endif %}{{ flags }}{% if flags %}\u001f{% endif %}--cfg=quenchant_compiler_policy\u001f-Zalways-encode-mir\u001f-Zinline-mir=no"
run = ".config/mise/scope cargo dylint --lib quenchant_dylints --no-deps -- --workspace --all-targets"

# `RUSTDOCFLAGS="-D warnings"` makes every rustdoc lint fatal for the targets
# rustdoc reads. The clippy wall's `missing_docs_in_private_items` supplies the
# missing-docs half; this gate supplies the rustdoc-lint half. The second pass
# reaches the arithmetic library's `fast` documentation.
["check:doc"]
description = "Check workspace private-item rustdoc with warnings denied"
env.RUSTDOCFLAGS = "-D warnings"
run = [
  ".config/mise/scope cargo doc --workspace --locked --no-deps --document-private-items",
  ".config/mise/scope cargo doc --workspace --locked --no-deps --document-private-items --features quenchant-arith/fast",
]

# The claim lifecycle (`.config/claims/decide.jq`, gandr-lang/gandr#1270)
# picks the claims that come off. Each case in `.config/claims/cases.json`
# holds an input and the removals it must give: a merge's `Advances` and
# closing targets, the closed, tracking and epic sweep, 24 hours of silence,
# and an open pull request that keeps a claim.
["check:claims"]
description = "The claim lifecycle gives each recorded case its removals"
tools.jq = "1.8.1"
run = '''
#!/usr/bin/env bash
set -euo pipefail
failed=0
while IFS= read -r case; do
  name=$(jq -r .name <<< "$case")
  got=$(jq .input <<< "$case" | jq -r -f .config/claims/decide.jq)
  want=$(jq -r .output <<< "$case")
  if [[ "$got" != "$want" ]]; then
    printf 'claims case FAILED: %s\n  gave:\n%s\n  wanted:\n%s\n' "$name" "$got" "$want" >&2
    failed=1
  fi
done < <(jq -c '.[]' .config/claims/cases.json)
(( failed == 0 )) || exit 1
echo "claims check OK: $(jq length .config/claims/cases.json) cases gave their removals"
'''

# What `wt:sweep` removes (`.config/worktrees/sweep.jq`). Each case in
# `.config/worktrees/cases.json` holds the worktrees' facts and the decisions
# they must give, as compact JSON.
["check:worktrees"]
description = "The worktree sweep gives each recorded case its decisions"
tools.jq = "1.8.1"
run = '''
#!/usr/bin/env bash
set -euo pipefail
failed=0
while IFS= read -r case; do
  name=$(jq -r .name <<< "$case")
  got=$(jq .input <<< "$case" | jq -c -f .config/worktrees/sweep.jq)
  want=$(jq -r .output <<< "$case")
  if [[ "$got" != "$want" ]]; then
    printf 'worktrees case FAILED: %s\n  gave:\n%s\n  wanted:\n%s\n' "$name" "$got" "$want" >&2
    failed=1
  fi
done < <(jq -c '.[]' .config/worktrees/cases.json)
(( failed == 0 )) || exit 1
echo "worktrees check OK: $(jq length .config/worktrees/cases.json) cases gave their decisions"
'''

# Fan out to every check:* task; a new check:* task is picked up without
# touching this one. Formatting stays explicit because its task name is
# treefmt:check rather than check:treefmt.
[check]
description = "Run every repository gate"
depends = ["check:*", "treefmt:check"]
