#:tombi toml-version = "v1.1.0"
#:schema https://mise.jdx.dev/schema/mise.json
# The published mise schema omits several live `settings` keys; strict mode
# would reject them.
#:tombi schema.strict = false

min_version = "2026.8.15"

[settings]
activate_aggressive = true
experimental = true
env_shell_expand = true
minimum_release_age = "1d"
lockfile = true

[settings.cargo]
binstall = true
# mise's built-in binstall: fetches crate binaries itself, no external
# cargo-binstall needed — without it, CI falls back to `cargo install`
# source builds for every cargo pin.
binstall_native = true
# mise disables cargo-quickinstall by default (jdx/mise PR 10923), so pins
# without crate-author binstall artifacts compile from source (~20 min CI
# lanes). Owner-accepted trust boundary: quickinstall's third-party binaries.
binstall_quickinstall = true

[settings.npm]
package_manager = "aube"

[env]
# Resolves rustup from PATH, else from its fixed install dir ($CARGO_HOME/bin,
# default ~/.cargo/bin), so activation never depends on the launching shell's
# PATH. Fails loudly when rustup is absent from both: a nonexistent-path
# fallback would let a Homebrew cargo keep resolving while RUSTUP_TOOLCHAIN
# silently binds nothing. The resolved dir must also carry the executable
# cargo/rustc proxy pair: a dir that resolves rustup but lacks the proxies
# (a partial install, a stale PATH entry) would keep cargo/rustc resolving
# to distribution copies while the pin points at nothing.
_.path = ["{{ exec(command='r=$(command -v rustup) || r=\"${CARGO_HOME:-$HOME/.cargo}/bin/rustup\"; [ -x \"$r\" ] || { echo \"rustup required: the pinned toolchains resolve through it\" >&2; exit 1; }; d=$(dirname \"$r\"); if [ ! -x \"$d/cargo\" ] || [ ! -x \"$d/rustc\" ]; then echo \"the rustup dir $d lacks the executable cargo/rustc proxies: the pinned toolchains resolve through the proxy pair\" >&2; exit 1; fi; printf \"%s\" \"$d\"') }}"]

[task_config]
includes = [".config/mise/tasks"]

# The formatter set, hooks, test runner, Dylint driver and linker, mutation
# instrument, and local CI runner are the complete tool surface. Formatter
# entries and pins move together: treefmt refuses to initialize with a missing
# formatter. The Dylint pair carries the version the policy library declares:
# `cargo dylint` builds the loaded library against its own `dylint_linting`, so
# a driver or linker at another version cannot load it.

# Every tool that publishes cross-platform release binaries installs through
# the github backend: a cargo: pin is a source build the moment binstall
# resolution misses, and that hazard recurs with every upstream default
# change.
[tools]
# The linker is the companion the driver invokes; the driver's own pin is a
# table below because `scripts/ci/check-pins.sh` reads it as one.
# Mutation campaigns are local, explicit experiments, not merge gates.
"cargo:cargo-mutants" = "27.1.0"
"cargo:dylint-link" = "6.0.4"
"github:aubepkg/aube" = "2.2.4"
"github:crate-ci/typos" = "v1.50.0"
"github:nextest-rs/nextest" = "cargo-nextest-0.9.143"
"github:numtide/treefmt" = "2.5.0"
"github:j178/prek" = "v0.5.0"
"github:koalaman/shellcheck" = "0.11.0"
"github:rvben/rumdl" = "0.2.62"
"github:tombi-toml/tombi" = "1.5.0"
"npm:@commitlint/cli" = "21.2.2"
"npm:oxfmt" = "0.65.0"
node = "26.8.1"

# sizelint publishes no release binaries; the one remaining source build.
[tools."cargo:sizelint"]
version = "0.1.5"

# The Dylint driver builds the workspace's own policy library and loads it into
# rustc. Neither it nor the linker publishes release binaries, so both stay
# `cargo:` pins.
[tools."cargo:cargo-dylint"]
version = "6.0.4"

# Local workflow runner, so a workflow change is testable without a push.
[tools."github:nektos/act"]
version = "0.2.89"
