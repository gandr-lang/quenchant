#:tombi toml-version = "v1.0.0"

[package]
name = "quenchant"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The #[quenchant::spec(...)] specification attribute under the quenchant namespace"
readme = "README.md"
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["arithmetic", "no-std", "nominal", "specification"]
categories = ["no-std", "rust-patterns"]
publish.workspace = true

# The facade is named here rather than through the workspace's `quenchant`
# alias: a package cannot take a dependency under its own name.
[dependencies]
quenchant-anodized.workspace = true

# `anodized` forwards the consumer-side selection to the facade, because the
# facade tests that condition in its own crate.
[features]
default = []
anodized = ["quenchant-anodized/anodized"]

[lints]
workspace = true
