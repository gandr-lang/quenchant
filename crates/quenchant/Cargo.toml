#:tombi toml-version = "v1.0.0"

[package]
name = "quenchant"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Specification-first hardening for Rust: types, obligations, tests, and gates that make evidence explicit."
readme = "README.md"
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["arithmetic", "no-std", "nominal", "specification"]
categories = ["no-std", "rust-patterns"]
publish.workspace = true

# The facade dependency exposes only the build-driver feature here.
[dependencies]
quenchant-anodized.workspace = true
quenchant-arith.workspace = true
quenchant-gates = { workspace = true, optional = true }
quenchant-shape.workspace = true

# The feature compiles the backend in; build cfgs select instrumentation.
# `gates` needs std and remains separate from the no_std libraries.
[features]
default = []
anodized = ["quenchant-anodized/anodized"]
gates = ["dep:quenchant-gates"]

[lints]
workspace = true
