[package]
name = "quenchant-dylints"
version.workspace = true
edition.workspace = true
description = "Dylint gates for nominal types, totality, and item specifications"
readme = "README.md"
repository.workspace = true
license.workspace = true
keywords = ["dylint", "lint", "specification"]
categories = ["development-tools"]
# Dylint loads this compiler-paired plugin from Git, not from crates.io.
publish = false

[package.metadata.rust-analyzer]
rustc_private = true

[lib]
crate-type = ["cdylib"]

# `rustc_private` driver code builds only under the workspace's pinned
# toolchain (the root `rust-toolchain.toml`), and the cdylib must be linked by
# `dylint-link` (see the crate-local `.cargo/config.toml`, which cargo reads
# because `dylint_testing` runs its builds with this package directory as the
# working directory).
[dependencies]
clippy_utils.workspace = true
dylint_linting.workspace = true
quenchant-anodized.workspace = true
quenchant-shape.workspace = true

# The fixture package owns foreign libraries acquired by the explicit UI build.
# These dependencies belong to the test harness itself.
[dev-dependencies]
dylint_testing.workspace = true
serde_json.workspace = true

[lints]
workspace = true
