#:tombi toml-version = "v1.0.0"

[workspace]
resolver = "3"
members = [
  "crates/quenchant",
  "crates/quenchant-anodized",
  "crates/quenchant-arith",
  "crates/quenchant-dylints",
  "crates/quenchant-fixture-macros",
  "crates/quenchant-gates",
  "crates/quenchant-shape",
  "crates/quenchant-spec-macros",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
homepage = "https://github.com/silvanshade/quenchant"
repository = "https://github.com/silvanshade/quenchant"
# One license for every package. The exception covers the Dylint library's
# compiler linking and GPL-2.0 compatibility, so no package carries a second.
license = "Apache-2.0 WITH LLVM-exception"
publish = ["crates-io"]

# Published executable specification instrumentation.
# consumers:
# - quenchant-anodized
# - quenchant-spec-macros (dev)
[workspace.dependencies.anodized-macros]
version = "=0.6.0"

# Clippy's internal lint-authoring utilities. The tag is the stable release the
# pinned nightly matches: rust-clippy's rust-<stable> tag names that nightly in
# its own rust-toolchain.toml, so the tag and the root toolchain file move
# together under `mise run toolchain:bump <stable>`.
# consumers:
# - quenchant-dylints
[workspace.dependencies.clippy_utils]
git = "https://github.com/rust-lang/rust-clippy"
tag = "rust-1.98.0"

# Dylint lint-library authoring runtime.
# consumers:
# - quenchant-dylints
[workspace.dependencies.dylint_linting]
version = "6.0.4"

# Dylint UI test harness for compiletest fixtures.
# consumers:
# - quenchant-dylints (dev)
[workspace.dependencies.dylint_testing]
version = "6.0.4"

# Token spans with source line and column positions. `span-locations` is
# required by the gate binary and harmless to the two libraries that only
# relocate tokens, so the graph carries one copy of the crate.
# consumers:
# - quenchant-fixture-macros
# - quenchant-gates
# - quenchant-shape (dev)
[workspace.dependencies.proc-macro2]
version = "1.0.107"
features = ["span-locations"]

# Consumer-named specification facade with optional instrumentation. The
# umbrella package reaches the same package under its real name below.
# consumers:
# - quenchant-arith
# - quenchant-shape
# - quenchant-dylints (dev)
[workspace.dependencies.quenchant]
package = "quenchant-anodized"
path = "crates/quenchant-anodized"
version = "=0.0.0"

# The specification facade under its own name. The umbrella package cannot take
# it through the `quenchant` alias above, because that is the umbrella's own
# package name.
# consumers:
# - quenchant
[workspace.dependencies.quenchant-anodized]
path = "crates/quenchant-anodized"
version = "=0.0.0"

# Nominal integer arithmetic, re-exported as `quenchant::arith`.
# consumers:
# - quenchant
[workspace.dependencies.quenchant-arith]
path = "crates/quenchant-arith"
version = "=0.0.0"

# Invocation-state and adequacy-witness reporting, re-exported as
# `quenchant::gates` behind the umbrella's optional feature of that name.
# consumers:
# - quenchant (optional)
[workspace.dependencies.quenchant-gates]
path = "crates/quenchant-gates"
version = "=0.0.0"

# Domain shapes shared by the policy packages.
# consumers:
# - quenchant
# - quenchant-dylints
# - quenchant-gates
[workspace.dependencies.quenchant-shape]
path = "crates/quenchant-shape"
version = "=0.0.0"
default-features = false

# Token-only conditional specification expansion.
# consumers:
# - quenchant-anodized
[workspace.dependencies.quenchant-spec-macros]
path = "crates/quenchant-spec-macros"
version = "=0.0.0"

# Quasi-quotation for relocating source tokens into a derived proof unit.
# consumers:
# - quenchant-shape (dev)
[workspace.dependencies.quote]
version = "1.0.47"
default-features = false

# JSON reader for Cargo and nextest machine output.
# consumers:
# - quenchant-gates
# - quenchant-dylints (dev)
[workspace.dependencies.serde_json]
version = "1.0.151"

# Rust source parser: the gate binary reads rustdoc witness declarations, and
# the shape library's Verus adapter reads its own source back out. One version
# serves both, so the graph carries one parser rather than two.
# consumers:
# - quenchant-gates
# - quenchant-shape (dev)
[workspace.dependencies.syn]
version = "3.0.4"
default-features = false
features = ["clone-impls", "full", "parsing", "printing", "proc-macro"]

[workspace.lints.clippy]
# all = { correctness, suspicious, style, complexity, perf }
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }

# nursery
missing_const_for_fn = "allow"
useless_let_if_seq = "allow"

# pedantic
similar_names = "allow"
too_many_lines = "allow"
uninlined_format_args = "allow"

# style
needless_raw_string_hashes = "allow"
needless_return = "allow"

# restriction
alloc_instead_of_core = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
as_pointer_underscore = "deny"
# The little-endian ruling: wire fields are written and read with explicit
# little-endian conversions, so the bytes are the same whatever the host's or
# the target's byte order. `host_endian_bytes` below is denied under the same
# ruling; a project with no wire format keeps both denials at no cost.
big_endian_bytes = "deny"
cfg_not_test = "deny"
clone_on_ref_ptr = "deny"
create_dir = "deny"
dbg_macro = "deny"
decimal_literal_representation = "deny"
default_numeric_fallback = "deny"
default_union_representation = "deny"
deref_by_slicing = "deny"
disallowed_script_idents = "deny"
doc_include_without_cfg = "deny"
doc_paragraphs_missing_punctuation = "deny"
empty_drop = "deny"
empty_enum_variants_with_brackets = "deny"
empty_structs_with_brackets = "deny"
error_impl_error = "deny"
exhaustive_enums = "allow"
exhaustive_structs = "allow"
exit = "deny"
expect_used = "deny"
field_scoped_visibility_modifiers = "deny"
filetype_is_file = "deny"
float_cmp_const = "deny"
fn_to_numeric_cast_any = "deny"
get_unwrap = "deny"
host_endian_bytes = "deny"
if_then_some_else_none = "deny"
impl_trait_in_params = "deny"
indexing_slicing = "deny"
infinite_loop = "deny"
inline_trait_bounds = "deny"
integer_division = "deny"
iter_over_hash_type = "deny"
large_include_file = "deny"
let_underscore_must_use = "deny"
lossy_float_literal = "deny"
map_err_ignore = "deny"
map_with_unused_argument_over_ranges = "deny"
mem_forget = "deny"
missing_assert_message = "deny"
missing_asserts_for_indexing = "deny"
missing_docs_in_private_items = "deny"
missing_inline_in_public_items = "deny"
mixed_read_write_in_expression = "deny"
mod_module_files = "deny"
# module_name_repetitions = "deny"
multiple_unsafe_ops_per_block = "deny"
mutex_atomic = "deny"
mutex_integer = "deny"
non_zero_suggestions = "deny"
panic = "deny"
pathbuf_init_then_push = "deny"
pattern_type_mismatch = "deny"
precedence_bits = "deny"
print_stderr = "deny"
print_stdout = "deny"
# pub_use = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
redundant_test_prefix = "deny"
redundant_type_annotations = "deny"
renamed_function_params = "deny"
return_and_then = "deny"
same_name_method = "deny"
semicolon_outside_block = "deny"
# Shadowing is preferred without exception.
# shadow_same = "deny"
# shadow_unrelated = "deny"
# single_call_fn = "deny"
single_char_lifetime_names = "deny"
std_instead_of_alloc = "deny"
std_instead_of_core = "deny"
str_to_string = "deny"
string_add = "deny"
string_lit_chars_any = "deny"
string_slice = "deny"
suspicious_xor_used_as_pow = "deny"
tests_outside_test_module = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unnecessary_safety_comment = "deny"
unnecessary_self_imports = "deny"
unreachable = "deny"
unused_result_ok = "deny"
unused_trait_names = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"
use_debug = "deny"
verbose_file_reads = "deny"

[workspace.lints.rust]
deprecated-safe = "deny"
future-incompatible = "deny"
keyword-idents = "deny"
let-underscore = "deny"
nonstandard-style = "deny"
refining-impl-trait = "deny"
rust-2018-compatibility = "deny"
rust-2018-idioms = "deny"
rust-2021-compatibility = "deny"
rust-2024-compatibility = "deny"
# Dylint drivers set `--cfg dylint_lib="<name>"`; crate code gates lint
# suppressions on it (the cfg_attr(dylint_lib = ...) sites), so the cfg name
# must be expected under every toolchain. The three `anodized_*` names are the
# specification runtime's own modes: enforcing test twins set `anodized_panic`
# across the whole dependency graph, and the UI matrix compiles fixtures under
# the other two.
unexpected_cfgs = { level = "deny", priority = -1, check-cfg = [
  "cfg(dylint_lib, values(any()))",
  "cfg(anodized_panic)",
  "cfg(anodized_print)",
  "cfg(anodized_discard_specs)",
] }
unknown-or-malformed-diagnostic-attributes = "deny"
# Nightly-creep guard: the Dylint library's rustc_private substrate is the
# tree's only sanctioned #![feature], carried as an expect on that crate alone.
unstable_features = "deny"
unused = "deny"
warnings = "deny"

[workspace.lints.rustdoc]
all = { level = "deny", priority = -1 }
# Module and item docs intentionally cross-link to private implementation items;
# docs are always built with `--document-private-items` (the `check:doc` task),
# so those targets resolve. Without this allow, the public-doc-links-to-private
# lint would reject the project's deliberate "link to the internals" doc style.
private_intra_doc_links = "allow"

# The Dylint wall self-hosts: the policy library is a member of this workspace
# and is loaded from its path, so no Git revision pins the wall and no consumer
# revision has to be repinned when a lint changes. An external consumer of this
# repository still loads it by `git` plus a full 40-hex `rev` and
# `pattern = "crates/quenchant-dylints"`.
[[workspace.metadata.dylint.libraries]]
path = "crates/quenchant-dylints"

# One test profile for the workspace, at the highest level any member needed:
# UI-heavy tests are codegen-bound, and optimized tests repay their small
# cold-build cost after repeated local and CI runs. Debug assertions and
# overflow checks remain enabled here, so the arithmetic and shape suites keep
# the specification they measure at this level as they did at their own lower one.
[profile.test]
opt-level = 2
