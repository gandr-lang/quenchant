# One grouped pull request per ecosystem per week, for releases at least a
# week old. CI skips dependabot's pull requests; the updates land through a
# maintainer's pull request.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    # clippy_utils is a Git dependency on rust-clippy's tag for the pinned
    # toolchain, so it moves only with the toolchain (`mise run
    # toolchain:bump`); an update on its own fails to resolve.
    ignore:
      - dependency-name: clippy_utils
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
