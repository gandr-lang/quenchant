# <critical>
# MUST preserve anchor-first CI: maximal sharing, no copied orchestration.
# New functionality MUST reuse template anchors or add anchors for likely reuse.
# MUST parameterize differences; performance exceptions require measured evidence.
# Share exceptional logic through actions; preserve parallelism, caches, and gates.
# </critical>
# Lists we produce are displayed collapsed: in `<details>` under a one-line
# summary of what, how many and the verdict.
name: Coverage

# Daily on main when main moved since the last upload, never per landing: an
# instrumented run pays a cold instrumented build and two to three times the
# test time, and a run per push was cancelled by the next push before it
# uploaded. A pull request that wants numbers dispatches this workflow, which
# always measures, or runs `mise run check:coverage`.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

# One run at a time; a dispatch during the scheduled run replaces it.
concurrency:
  group: coverage-main
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  CARGO_UNSTABLE_CHECKSUM_FRESHNESS: "true"
  CARGO_BUILD_FINGERPRINT: content
  CARGO_NEXTEST_VERSION: "0.9.143"
  MISE_CARGO_BINSTALL_QUICKINSTALL: "true"
  MISE_CARGO_BINSTALL_NATIVE: "true"
  # Must match ci.yml and the image. The image checks the list at build time.
  MISE_DISABLE_TOOLS: "cargo:cargo-mutants,github:nektos/act,github:j178/prek,npm:@commitlint/cli"
  # Empty until ci-image publishes the pin-file tag. The repository variable
  # activates that tag without a workflow edit; act accepts the same variable.
  QUENCHANT_CI_IMAGE: ${{ vars.QUENCHANT_CI_IMAGE }}

jobs:
  # Definitions only: aliases run in each consuming job's context.
  template:
    if: false
    runs-on: &linux ubuntu-24.04-arm
    permissions: &image-read-permissions
      contents: read
      packages: read
    steps:
      - &git-checkout
        name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      # A job container runs as root over a workspace the runner user owns,
      # and git refuses such a repository until it is trusted.
      - &trust-workspace
        name: trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - &resolve-image
        id: resolve
        name: resolve the image reference
        run: echo "ref=${QUENCHANT_CI_IMAGE:+ghcr.io/gandr-lang/quenchant-ci:${QUENCHANT_CI_IMAGE}}" >> "$GITHUB_OUTPUT"
      - &setup-rust
        name: setup rust
        uses: ./.github/actions/setup-rust # zizmor: ignore[self-repository]
        with:
          install-toolchain: &without-image ${{ needs.ci-image-ref.outputs.ref == '' }}
          cache-save: false
      - &install-tools
        name: install job tools
        if: *without-image
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        env:
          CI_TOOLS_NEXTEST: cargo-nextest@${{ env.CARGO_NEXTEST_VERSION }}
        with:
          tool: ${{ env[env.CI_TOOLS] }}
      - &install-policy-tools
        name: install mise-managed policy tools
        if: *without-image
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.3
          cache: true
          cache_key: mise-ci-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'mise.lock', 'rust-toolchain.toml') }}
          cache_save: false
      # The instrumented build lives in its own target directory and nothing
      # else writes it, so this job is its one cache writer. The key is the
      # dependency fingerprint: the dependencies' instrumented artifacts are
      # what a run reuses (cargo-llvm-cov rebuilds the workspace's own crates
      # so coverage data is never stale), so one entry per fingerprint is
      # exact, and a partial match restores the newest entry to rebuild from.
      # The fingerprint is taken in the shell over the tracked manifests:
      # `hashFiles` runs on the host and walks the whole workspace, which the
      # container's restored `target/` makes it fail (#87).
      - &identify-coverage-state
        name: identify coverage-state inputs
        shell: bash
        run: |
          fingerprint=$(git ls-files -z -- ':(glob)**/Cargo.toml' Cargo.lock rust-toolchain.toml .cargo/config.toml | sort -z | xargs -0 sha256sum | sha256sum)
          printf 'COVERAGE_STATE_FINGERPRINT=%s\n' "${fingerprint%% *}" >> "$GITHUB_ENV"
      - &restore-coverage-state
        name: restore instrumented build state
        id: coverage-state-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/coverage
          key: quenchant-v1-coverage-state-${{ runner.os }}-${{ runner.arch }}-${{ env.COVERAGE_STATE_FINGERPRINT }}
          restore-keys: quenchant-v1-coverage-state-${{ runner.os }}-${{ runner.arch }}-
      - &measure-coverage
        name: measure enforcing coverage
        run: mise run check:coverage
      # Whether an instrumented build exists, tested in the shell and read as
      # a flag: a `hashFiles` walk of `target/coverage` fails as above.
      - &find-coverage-state
        name: find the instrumented build
        if: ${{ !cancelled() }}
        shell: bash
        run: if [[ -n "$(find target/coverage -name .rustc_info.json -print -quit 2>/dev/null)" ]]; then echo COVERAGE_STATE_BUILT=true >> "$GITHUB_ENV"; fi
      - &save-coverage-state
        name: cache instrumented build state
        if: ${{ !cancelled() && steps.coverage-state-restore.outputs.cache-hit != 'true' && env.COVERAGE_STATE_BUILT == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/coverage
          key: ${{ steps.coverage-state-restore.outputs.cache-primary-key }}
      - &upload-coverage
        name: upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.lcov
          flags: enforcing
          fail_ci_if_error: true
          disable_search: true

  # container cannot read env directly; needs carries the workflow switch.
  ci-image-ref:
    name: resolve the CI image reference
    runs-on: *linux
    permissions: *image-read-permissions
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - *resolve-image

  # The scheduled run measures only when main moved since the last successful
  # upload; a dispatch always measures. A run that skipped the measurement
  # succeeds at the same commit the last upload covered, so the comparison
  # stays exact across skips, and a failed measurement is retried next day.
  freshness:
    name: decide whether main moved since the last upload
    runs-on: *linux
    permissions:
      actions: read
    outputs:
      stale: ${{ steps.compare.outputs.stale }}
    steps:
      - id: compare
        name: compare main against the last successful upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          uploaded=$(gh run list --workflow coverage.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          if [ "$uploaded" = "$GITHUB_SHA" ]; then
            echo "main is at $GITHUB_SHA, the commit the last successful upload covered: nothing to measure"
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "main is at $GITHUB_SHA, the last successful upload covered ${uploaded:-nothing}: measuring"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

  coverage:
    name: measure and upload coverage
    needs: [ci-image-ref, freshness]
    if: ${{ !cancelled() && !failure() && (github.event_name == 'workflow_dispatch' || needs.freshness.outputs.stale == 'true') }}
    # The measuring run stays on x86-64, as gandr's does.
    runs-on: ubuntu-latest
    permissions: *image-read-permissions
    container: ${{ needs.ci-image-ref.outputs.ref }} # zizmor: ignore[unpinned-images]
    timeout-minutes: 45
    env:
      CI_TOOLS: CI_TOOLS_NEXTEST
    steps:
      - *git-checkout
      - *trust-workspace
      - *setup-rust
      - *install-tools
      - *install-policy-tools
      - *identify-coverage-state
      - *restore-coverage-state
      - *measure-coverage
      - *find-coverage-state
      - *save-coverage-state
      - *upload-coverage
