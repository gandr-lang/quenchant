# <critical>
# MUST preserve anchor-first CI: maximal sharing, no copied orchestration.
# New functionality MUST reuse template anchors or add anchors for likely reuse.
# MUST parameterize differences; performance exceptions require measured evidence.
# Share exceptional logic through actions; preserve parallelism, caches, and gates.
# </critical>
name: CI

on:
  pull_request: {}
  workflow_dispatch: {}
  # Only main can warm caches that subsequent pull requests can restore.
  push:
    branches: [main]
  merge_group: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never cancel the main cache warmer when another commit lands.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  # Match local content fingerprints; Cargo still checks changed inputs and flags.
  CARGO_UNSTABLE_CHECKSUM_FRESHNESS: "true"
  CARGO_BUILD_FINGERPRINT: content
  CARGO_NEXTEST_VERSION: "0.9.143"
  DYLINT_VERSION: "6.0.4"
  MISE_CARGO_BINSTALL_QUICKINSTALL: "true"
  MISE_CARGO_BINSTALL_NATIVE: "true"
  # These tools have no CI consumer. The Dockerfile checks this same list.
  MISE_DISABLE_TOOLS: "cargo:cargo-mutants,github:nektos/act,github:j178/prek,npm:@commitlint/cli"
  # Empty until ci-image publishes the pin-file tag. The repository variable
  # activates that tag without a workflow edit; act accepts the same variable.
  QUENCHANT_CI_IMAGE: ${{ vars.QUENCHANT_CI_IMAGE }}

jobs:
  # Definitions only: aliases run in each consuming job's context.
  template:
    if: false
    needs: &rust-needs prepare
    # arm64, as gandr's lanes (gandr-lang/gandr#702: its suite 27% and a warm
    # rebuild 9% faster than ubuntu-latest's x86-64). coverage.yml's measuring
    # run is the one x86-64 Linux job, so the image is published for both.
    runs-on: &linux ubuntu-24.04-arm
    # Job containers pull repository-linked GHCR images with GITHUB_TOKEN.
    permissions: &image-read-permissions
      contents: read
      packages: read
    steps:
      # Checkout stays shallow except where commit lint and publication need history.
      - &git-checkout
        name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ env.CI_FETCH_DEPTH || '1' }}
      # A job container runs as root over a workspace the runner user owns,
      # and git refuses such a repository until it is trusted.
      - &trust-workspace
        name: trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - &setup-rust
        name: setup rust
        uses: ./.github/actions/setup-rust # zizmor: ignore[self-repository]
        with:
          install-toolchain: &without-image ${{ needs.prepare.outputs.image == '' }}
          cache-save: ${{ env.CI_CACHE_SAVE == 'true' }}
          cache-key: ${{ env.CI_CACHE_KEY || 'rust-deps' }}
          cache-workspace-crates: true
      - &install-tools
        name: install job tools
        if: ${{ env.CI_INSTALL_TOOLS != 'false' }}
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        # Tool sets resolve here: job-level env cannot reference workflow env.
        env:
          CI_TOOLS_NEXTEST: cargo-nextest@${{ env.CARGO_NEXTEST_VERSION }}
          CI_TOOLS_DYLINT: cargo-dylint@${{ env.DYLINT_VERSION }},dylint-link@${{ env.DYLINT_VERSION }},cargo-nextest@${{ env.CARGO_NEXTEST_VERSION }}
          CI_TOOLS_ZIZMOR: zizmor
        with:
          tool: ${{ env[env.CI_TOOLS] }}
      # Install the whole CI subset in the cached setup step: later mise
      # auto-installs otherwise escape that cache.
      - &install-policy-tools
        name: install mise-managed policy tools
        if: *without-image
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.8.15
          # Keep Rustup proxies supplying RUSTUP_TOOLCHAIN to compiler plugins.
          export_path: false

      # Exact policy hits only: stale path-crate mtimes can load wrong policy.
      # Save in the job body, before rust-cache's post-job pruning.
      - &restore-dylint-drivers
        name: restore Dylint drivers
        id: dylint-drivers-restore
        if: *without-image
        uses: &cache-restore actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: &dylint-drivers ~/.dylint_drivers
          key: dylint-drivers-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ env.DYLINT_VERSION }}
      - &restore-dylint-library
        name: restore Dylint library
        id: dylint-library-restore
        uses: *cache-restore
        with:
          path: &dylint-library target/dylint
          key: dylint-library-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ env.DYLINT_VERSION }}-${{ hashFiles('crates/quenchant-dylints/**', 'Cargo.toml', 'Cargo.lock') }}
      - &save-dylint-library
        name: save Dylint library
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.dylint-library-restore.outputs.cache-hit != 'true' }}
        uses: &cache-save actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *dylint-library
          key: ${{ steps.dylint-library-restore.outputs.cache-primary-key }}
      - &save-dylint-drivers
        name: save Dylint drivers
        if: ${{ !cancelled() && needs.prepare.outputs.image == '' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.dylint-drivers-restore.outputs.cache-hit != 'true' }}
        uses: *cache-save
        with:
          path: *dylint-drivers
          key: ${{ steps.dylint-drivers-restore.outputs.cache-primary-key }}
      - &upload-test-report
        name: upload test report
        if: always()
        continue-on-error: true
        uses: &upload-artifact actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.CI_REPORT_NAME }}
          path: ${{ env.CI_REPORT_PATH }}
          if-no-files-found: ignore

  # One job reads what the run's lanes decide on, so neither lookup costs a
  # runner of its own:
  # - the changed-file categories. A missing base or a failed fetch or diff
  #   forces the Rust checks, never skips them; the queue always checks its
  #   complete merge result;
  # - whether the pull request is a stacked member, based on another pull
  #   request's branch rather than main;
  # - the image reference: a job's container cannot read env directly, so
  #   the job's outputs carry the workflow switch.
  # Always trigger the workflow: a skipped workflow supplies no required
  # check, whereas a skipped job succeeds. Formatting sees docs-only changes.
  prepare:
    name: prepare the run
    # Dependency updates land through a maintainer's pull request, so a
    # dependabot pull request runs nothing: this job skips, every job that
    # needs it skips with it, and a skipped required check passes.
    if: &not-dependabot ${{ github.actor != 'dependabot[bot]' }}
    runs-on: *linux
    outputs:
      rust: ${{ github.event_name == 'merge_group' || steps.fetch.outcome != 'success' || steps.filter.outcome != 'success' || steps.filter.outputs.rust == 'true' }}
      stacked: ${{ github.event_name == 'pull_request' && github.base_ref != github.event.repository.default_branch }}
      image: ${{ steps.image.outputs.ref }}
    env:
      CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - *git-checkout
      - id: fetch
        name: fetch the comparison tree
        if: ${{ github.event_name != 'merge_group' }}
        continue-on-error: true
        run: git fetch --depth=1 origin "$CI_BASE_SHA"
      - id: filter
        name: filter changed paths
        if: ${{ github.event_name != 'merge_group' && steps.fetch.outcome == 'success' }}
        continue-on-error: true
        # One pipeline, no shell control flow or third-party filter action.
        # NUL framing preserves filenames; no-renames retains source deletions.
        # pipefail makes a failed diff distinguishable from an empty diff.
        shell: bash
        run: >-
          git diff --no-renames --name-only -z "$CI_BASE_SHA" HEAD |
          jq -rRs '"rust=" + (split("\u0000") | any(length > 0 and ((endswith(".md") or startswith("docs/") or startswith("LICENSE") or . == ".gitignore") | not)) | tostring)'
          >> "$GITHUB_OUTPUT"
      - id: image
        name: resolve the image reference
        run: echo "ref=${QUENCHANT_CI_IMAGE:+ghcr.io/gandr-lang/quenchant-ci:${QUENCHANT_CI_IMAGE}}" >> "$GITHUB_OUTPUT"

  # Rust, test, and workflow changes exercise the full gate before review;
  # merge groups still check their complete merge result. A stacked member,
  # based on another pull request's branch, runs the lint lanes only: the
  # merge group tests its tree (gandr-lang/gandr#2045).
  cargo-build-crates:
    name: build and test the workspace
    needs: *rust-needs
    if: &heavy-lane ${{ needs.prepare.outputs.rust == 'true' && needs.prepare.outputs.stacked != 'true' }}
    runs-on: *linux
    permissions: *image-read-permissions
    # The relayed tag hashes the three pin files; the base is digest-pinned.
    container: &ci-image ${{ needs.prepare.outputs.image }} # zizmor: ignore[unpinned-images]
    env:
      CI_CACHE_SAVE: "true"
      CI_INSTALL_TOOLS: *without-image
      CI_TOOLS: CI_TOOLS_NEXTEST
      CI_REPORT_NAME: junit-workspace
      CI_REPORT_PATH: target/nextest/ci/junit.xml
    steps:
      - *git-checkout
      - *trust-workspace
      - *setup-rust
      - *install-tools
      - *install-policy-tools
      - name: build workspace targets
        run: cargo build --workspace --all-targets
      - name: build workspace targets in fast arithmetic mode
        run: cargo build --workspace --all-targets --features quenchant-arith/fast
      - name: verify publishable packages without uploading
        run: mise run check:publish-dry-run
      - name: check libraries without a standard library
        run: cargo build --locked -p quenchant-arith -p quenchant-shape --no-default-features --target thumbv7em-none-eabi
      - name: check fast libraries without a standard library
        run: cargo build --locked -p quenchant-arith -p quenchant-shape --no-default-features --features quenchant-arith/fast --target thumbv7em-none-eabi
      - name: test the workspace
        run: cargo nextest run --profile ci --workspace --exclude quenchant-dylints
      - name: test the workspace in release
        run: cargo nextest run --profile ci --workspace --exclude quenchant-dylints --release
      - name: test the workspace in fast arithmetic mode
        run: cargo nextest run --profile ci --workspace --exclude quenchant-dylints --features quenchant-arith/fast
      - name: test the workspace with enforcement
        env: &enforcing-specifications
          RUSTFLAGS: --cfg anodized_panic
        run: >-
          cargo nextest run --profile ci --workspace --exclude quenchant-dylints
          --features quenchant-anodized/anodized
      - name: test documentation examples
        run: cargo test --doc -p quenchant-arith -p quenchant-shape -p quenchant-anodized -p quenchant-spec-macros -p quenchant-fixture-macros
      - name: check private-item rustdoc
        env: &rustdoc-warnings
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --document-private-items
      - name: check private-item rustdoc in fast arithmetic mode
        env: *rustdoc-warnings
        run: cargo doc --workspace --no-deps --document-private-items --features quenchant-arith/fast
      - *upload-test-report

  cargo-dylint-gates:
    name: test Dylint library
    needs: *rust-needs
    if: *heavy-lane
    runs-on: *linux
    permissions: *image-read-permissions
    container: *ci-image # zizmor: ignore[unpinned-images]
    env:
      CI_CACHE_SAVE: "true"
      # The fixture graph excludes plugin/harness artifacts from its cache.
      CI_CACHE_KEY: dylint-v2
      CI_INSTALL_TOOLS: *without-image
      CI_TOOLS: CI_TOOLS_DYLINT
      CI_REPORT_NAME: junit-dylint
      CI_REPORT_PATH: target/nextest/ci/junit.xml
    steps:
      - *git-checkout
      - *trust-workspace
      - *setup-rust
      - *restore-dylint-drivers
      - *restore-dylint-library
      - *install-tools
      - *install-policy-tools
      - name: test Dylint package
        working-directory: &dylint-package crates/quenchant-dylints
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: cargo nextest run --profile ci
      - *upload-test-report
      - name: exercise enforcing specification exits
        working-directory: *dylint-package
        env:
          # Environment flags replace Cargo configuration; retain the linker.
          RUSTFLAGS: --cfg anodized_panic -C linker=dylint-link
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/dylint-tests-enforcing
        run: cargo nextest run --profile ci --features quenchant-anodized/anodized -E 'test(specification_tests::)'
      - name: upload enforcing test report
        if: always()
        continue-on-error: true
        uses: *upload-artifact
        with:
          name: junit-dylint-enforcing
          path: target/nextest/ci/junit.xml
          if-no-files-found: error
      - name: lint Dylint package
        working-directory: *dylint-package
        run: cargo clippy --all-targets -- --deny warnings
      - name: load Dylint library over workspace
        run: mise run check:dylint
      - name: resolve adequacy witnesses
        env:
          # Match package-directory builds, including the test inventory.
          RUSTFLAGS: -C linker=dylint-link
        run: cargo run -p quenchant-gates -- witnesses --manifest-path Cargo.toml
      - *save-dylint-library
      - *save-dylint-drivers

  anodized-gate:
    name: check anodized invocation policy
    needs: *rust-needs
    if: &rust-lane ${{ needs.prepare.outputs.rust == 'true' }}
    runs-on: *linux
    permissions: *image-read-permissions
    container: *ci-image # zizmor: ignore[unpinned-images]
    steps:
      - *git-checkout
      - *trust-workspace
      - *setup-rust
      - name: install the gate binary
        run: cargo install --path crates/quenchant-gates --locked --root "$RUNNER_TEMP/quenchant-gates"
      - name: report installed anodized invocation state
        run: '"$RUNNER_TEMP/quenchant-gates/bin/quenchant-gates" anodized --manifest-path Cargo.toml'
      - name: require installed anodized enforcement
        env: *enforcing-specifications
        run: '"$RUNNER_TEMP/quenchant-gates/bin/quenchant-gates" anodized --manifest-path Cargo.toml --require-enforcing'

  cargo-clippy-crates:
    name: check Clippy wall
    needs: *rust-needs
    if: *rust-lane
    runs-on: *linux
    permissions: *image-read-permissions
    container: *ci-image # zizmor: ignore[unpinned-images]
    steps:
      - *git-checkout
      - *trust-workspace
      - *setup-rust
      - name: lint every workspace target outside the Dylint package
        run: cargo clippy --workspace --all-targets --exclude quenchant-dylints -- --deny warnings
      - name: lint every workspace target in fast arithmetic mode
        run: cargo clippy --workspace --all-targets --exclude quenchant-dylints --features quenchant-arith/fast -- --deny warnings
      - name: lint enforcing specifications
        env: *enforcing-specifications
        run: >-
          cargo clippy --workspace --all-targets --exclude quenchant-dylints
          --features quenchant-anodized/anodized
          -- --deny warnings

  format-gate:
    name: check policy and formatting
    needs: prepare
    runs-on: *linux
    permissions: *image-read-permissions
    container: *ci-image # zizmor: ignore[unpinned-images]
    env:
      CI_FETCH_DEPTH: "0"
    steps:
      - *git-checkout
      - *trust-workspace
      - *setup-rust
      - *install-policy-tools
      - name: check formatting and static policy
        run: mise run treefmt:check
      - name: check dependency policy
        run: mise run check:deny
      - name: check conflict markers
        run: mise run check:conflict-markers
      - name: check public boundary
        run: mise run check:public-boundary
      - name: check shared baseline
        run: mise run check:baseline-hash
      - name: check compiler and Dylint pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run check:ci-pins
      - name: check Action allowlist and pins
        run: mise run check:action-pins
      - name: check workflow hashing
        run: mise run check:workflow-hashing
      - name: check publication metadata
        run: mise run check:publish
      - name: lint authored commits
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        shell: bash
        env:
          COMMITLINT_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          MISE_DISABLE_TOOLS: "cargo:cargo-mutants,github:nektos/act,github:j178/prek"
        run: git rev-list --reverse --no-merges "$COMMITLINT_BASE..HEAD" | xargs -I{} env COMMITLINT_COMMIT={} mise exec -- commitlint --from {}~1 --to {}

  workflow-lint:
    name: check workflow lints (zizmor)
    if: *not-dependabot
    runs-on: *linux
    env:
      CI_TOOLS: CI_TOOLS_ZIZMOR
    steps:
      - *git-checkout
      - *install-tools
      - name: zizmor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: zizmor .github/workflows
