# <critical>
# MUST preserve anchor-first CI: maximal sharing, no copied orchestration.
# New functionality MUST reuse template anchors or add anchors for likely reuse.
# MUST parameterize differences; performance exceptions require measured evidence.
# Share exceptional logic through actions; preserve native parallel image builds.
# </critical>
# Lists we produce are displayed collapsed: in `<details>` under a one-line
# summary of what, how many and the verdict.
name: CI image

on:
  push:
    branches: [main]
    paths:
      - mise.toml
      - mise.lock
      - rust-toolchain.toml
      - .github/docker/ci.Dockerfile
  # Refresh upstream releases and base digest rotations even without pin edits.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: ci-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  template:
    if: false
    # Every CI job that runs the image runs on arm64 except coverage.yml's
    # measuring run.
    runs-on: &linux ubuntu-24.04-arm
    permissions: &image-permissions
      contents: read
      packages: write
    steps:
      - &git-checkout
        name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &registry-login
        name: log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - &setup-buildx
        name: set up buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

  # Native compilation on both architectures; never QEMU for Rust tool builds.
  build:
    name: build the CI image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions: *image-permissions
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: *linux
    steps:
      - *git-checkout
      - *registry-login
      - *setup-buildx
      - id: build
        name: build and push by digest
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: ${{ matrix.platform }}
          context: .
          file: .github/docker/ci.Dockerfile
          # BuildKit mounts this only while mise verifies release attestations.
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          outputs: type=image,name=ghcr.io/gandr-lang/quenchant-ci,push-by-digest=true,name-canonical=true,push=true
      - name: create the digest directory
        run: mkdir -p /tmp/digests
      - name: export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: touch "/tmp/digests/${DIGEST#sha256:}"
      - name: upload the digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: publish the manifest list
    needs: build
    runs-on: *linux
    permissions: *image-permissions
    steps:
      - *git-checkout
      # Ordered pin bytes define the tag. Dockerfile edits rebuild that tag;
      # latest names the newest successful manifest, never a workflow pin.
      - id: tag
        name: compute the image tag
        run: cat mise.toml mise.lock rust-toolchain.toml | sha256sum | sed 's/ .*//; s/^/tag=/' >> "$GITHUB_OUTPUT"
      - name: download the digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - *registry-login
      - *setup-buildx
      - name: create and push the manifest list
        env: &image-tag
          TAG: ${{ steps.tag.outputs.tag }}
        working-directory: /tmp/digests
        # Digest filenames are action outputs, not contributor-controlled text.
        # Word splitting intentionally supplies one reference per digest.
        run: >-
          docker buildx imagetools create
          --tag "ghcr.io/gandr-lang/quenchant-ci:${TAG}"
          --tag ghcr.io/gandr-lang/quenchant-ci:latest
          $(printf 'ghcr.io/gandr-lang/quenchant-ci@sha256:%s ' *)
      - name: inspect the published image
        env: *image-tag
        run: docker buildx imagetools inspect "ghcr.io/gandr-lang/quenchant-ci:${TAG}"
